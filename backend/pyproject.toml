[project]
name = "codegraph-ai-backend"
version = "0.1.0"
description = "Backend API for CodeGraph AI - GraphRAG-powered codebase analysis assistant"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The integration test needs Neo4j, Qdrant, the embedding model and an LLM key: it is skipped
# by default. Run it with: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: the whole pipeline on the real services (docker compose up -d neo4j qdrant)",
]
