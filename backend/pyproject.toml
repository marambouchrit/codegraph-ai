[project]
name = "codegraph-ai-backend"
version = "0.1.0"
description = "Backend API for CodeGraph AI - GraphRAG-powered codebase analysis assistant"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Tests that need internet access, a server, a downloaded model or an API key are skipped by default.
# Run them with: pytest -m network / neo4j / qdrant / embeddings / llm
addopts = "-m 'not network and not neo4j and not qdrant and not embeddings and not llm'"
markers = [
    "network: tests that need internet access",
    "neo4j: tests that need a running Neo4j server (docker compose up -d neo4j)",
    "qdrant: tests that need a running Qdrant server (docker compose up -d qdrant)",
    "embeddings: tests that run the real embedding model (downloaded on first use)",
    "llm: tests that call the real LLM provider (needs an API key, costs a few cents)",
]
filterwarnings = [
    # Unit tests use qdrant-client's in-memory mode, which has no payload indexes.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
