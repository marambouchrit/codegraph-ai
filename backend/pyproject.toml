[project]
name = "codegraph-ai-backend"
version = "0.1.0"
description = "Backend API for CodeGraph AI - GraphRAG-powered codebase analysis assistant"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Tests that need internet access are skipped by default. Run them with: pytest -m network
addopts = "-m 'not network'"
markers = ["network: tests that need internet access"]
